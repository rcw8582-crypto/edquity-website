# Releases date-scheduled blog posts without anyone pushing a commit.
#
# Posts are baked into the site at build time, and src/lib/posts.ts hides any
# post whose publishedAt date is later than the build date. A rebuild is
# therefore what releases a scheduled post.
#
# This job checks each morning whether a post is due today. When one is, it
# pushes an empty commit, which is what Vercel already watches, so the site
# rebuilds and the post appears. On every other morning it exits quietly and
# writes nothing, so the git history gains a commit only on release days.
#
# No setup, no secrets, no Vercel configuration. Switch the schedule off by
# disabling this workflow in the repository's Actions tab.

name: Scheduled publish

on:
  schedule:
    # 12:00 UTC daily, which is 7:00 AM Central Daylight Time and 6:00 AM Central Standard Time.
    - cron: "0 12 * * *"
  # Lets you release a due post immediately from the Actions tab.
  workflow_dispatch:

# Pushing a commit needs write access to the repository contents.
permissions:
  contents: write

# Two runs pushing at once would race, so a new run waits its turn.
concurrency:
  group: scheduled-publish
  cancel-in-progress: false

jobs:
  release-due-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find posts due today
        id: due
        run: |
          # Central time decides the release date, so a post dated the 24th
          # goes out on the 24th in Nashville rather than on UTC's calendar.
          TODAY=$(TZ=America/Chicago date +%F)
          echo "Checking for posts dated $TODAY (America/Chicago)"

          DUE=""
          for file in content/posts/*.md; do
            # Frontmatter only, which is everything above the second --- line.
            fm=$(awk 'NR>1 && /^---$/{exit} {print}' "$file")
            case "$fm" in
              *"published: true"*) ;;
              *) continue ;;
            esac
            date_line=$(printf '%s\n' "$fm" | sed -n 's/^publishedAt:[[:space:]]*"\{0,1\}\([0-9-]\{10\}\).*/\1/p')
            if [ "$date_line" = "$TODAY" ]; then
              title=$(printf '%s\n' "$fm" | sed -n 's/^title:[[:space:]]*"\(.*\)"[[:space:]]*$/\1/p')
              echo "  due: $title"
              DUE="$DUE$title
          "
            fi
          done

          if [ -z "$DUE" ]; then
            echo "Nothing is due today, so no rebuild is needed."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo "titles<<EOF"
              printf '%s' "$DUE"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger a rebuild so the due post goes live
        if: steps.due.outputs.found == 'true'
        env:
          TITLES: ${{ steps.due.outputs.titles }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "Release scheduled post" -m "$TITLES"
          git push
          echo "Pushed. Vercel rebuilds from this commit and the post appears."
